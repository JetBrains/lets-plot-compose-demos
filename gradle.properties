#Gradle
org.gradle.jvmargs=-Xmx4096M -Dkotlin.daemon.jvm.options\="-Xmx4096M"

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M
kotlin.jvm.target.validation.mode=error

#MPP
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2

#Compose
org.jetbrains.compose.experimental.uikit.enabled=true
kotlin.native.cacheKind=none

#Android
agp.version=8.6.0
android.useAndroidX=true
android.compileSdk=35
android.targetSdk=34
android.minSdk=24

#Versions
kotlin.version=2.1.0
compose.version=1.8.2
androidx.activity.compose=1.8.2
# Skiko version should be compatible with Compose version
# Check skiko in the Compose version here (change the version in the URL as needed):
# https://repo1.maven.org/maven2/org/jetbrains/compose/ui/ui-desktop/1.8.2/ui-desktop-1.8.2.pom
skiko.version=0.9.4.2

letsPlot.version=4.7.2
letsPlotKotlin.version=4.11.1
letsPlotSkia.version=3.0.0-alpha4
